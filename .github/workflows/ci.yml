name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradejournal_test
          POSTGRES_USER: tradejournal
          POSTGRES_PASSWORD: tradejournal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradejournal -d tradejournal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tradejournal:tradejournal@localhost:5432/tradejournal_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve and verify dependencies
        run: go mod tidy

      - name: Check Go formatting
        run: gofmt -w .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -trimpath ./cmd/api
